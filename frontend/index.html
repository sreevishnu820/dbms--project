<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Command Classifier</title>
    <style>
        :root { --bg: #ffffff; --text: #333333; --box-bg: #f9f9f9; --border: #ddd; }
        body.dark-mode { --bg: #1e1e1e; --text: #f0f0f0; --box-bg: #2d2d2d; --border: #444; }
        
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; transition: 0.3s; }
        .container { max-width: 800px; margin: auto; }
        
        /* Tab Navigation */
        .nav-tabs { margin-bottom: 20px; border-bottom: 2px solid #0078D7; padding-bottom: 10px; }
        .nav-tabs button { background: none; border: none; font-size: 16px; margin-right: 15px; cursor: pointer; color: var(--text); font-weight: bold; }
        .nav-tabs button:hover { color: #0078D7; }
        
        /* Tab Content */
        .tab-content { display: none; padding: 20px; background: var(--box-bg); border-radius: 8px; margin-top: 10px; border: 1px solid var(--border); }
        .tab-content.active { display: block; }
        
        /* Input & Buttons */
        textarea { width: 100%; height: 100px; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid var(--border); font-size: 16px; background: var(--bg); color: var(--text); box-sizing: border-box; }
        .btn { background: #0078D7; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn:hover { background: #005a9e; }
        .btn-success { background: #28a745; margin-left: 10px; }
        .btn-success:hover { background: #218838; }
        
        /* Results */
        .result-card { margin-top: 20px; padding: 15px; border: 1px solid var(--border); border-radius: 5px; display: none; background: var(--bg); }
        .badge { display: inline-block; padding: 5px 10px; background-color: #28a745; color: white; border-radius: 3px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn" style="float: right;" onclick="toggleTheme()">🌙 Toggle Theme</button>
        <h1>SQL Command Classifier Engine</h1>
        
        <div class="nav-tabs">
            <button onclick="showTab('classifier')">Classifier</button>
            <button onclick="showTab('learn')">Learn</button>
            <button onclick="showTab('help')">Help</button>
            <button onclick="showTab('dev')">Developed By</button>
        </div>

        <!-- MAIN CLASSIFIER TAB -->
        <div id="classifier" class="tab-content active">
            <p>Enter a SQL command to analyze its core type (DDL, DML, DQL, DCL, TCL).</p>
            <textarea id="sqlInput" placeholder="e.g., CREATE TABLE Student (id INT);"></textarea>
            
            <button class="btn" onclick="analyzeSQL()">Classify Command</button>
            <button class="btn btn-success" onclick="window.print()">📄 Export Report</button>

            <div id="resultCard" class="result-card">
                <div id="categoryBadge" class="badge"></div>
                <p><strong>Detected Command:</strong> <span id="commandVal"></span></p>
                <p><strong>Primary Purpose:</strong> <span id="purposeVal"></span></p>
                <p><strong>Database Effect:</strong> <span id="effectVal"></span></p>
                <hr style="border-top: 1px solid var(--border);">
                <p><em><span id="explanationVal"></span></em></p>
            </div>
        </div>

        <!-- PLACEHOLDER TABS (We will fill these next) -->
        <div id="learn" class="tab-content">
            <h2>Learn SQL Commands</h2>
            <p>Content coming soon...</p>
        </div>
        <div id="help" class="tab-content">
            <h2>How to Use the Classifier</h2>
            <p>Content coming soon...</p>
        </div>
        <div id="dev" class="tab-content">
            <h2>Developed By</h2>
            <p>Content coming soon...</p>
        </div>
    </div>

    <script>
        // Tab Navigation Logic
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        // Dark/Light Mode Logic
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        // API Fetch Logic
        async function analyzeSQL() {
            const sqlText = document.getElementById('sqlInput').value;
            if (!sqlText) return alert('Please enter a SQL command first.');

            try {
                const response = await fetch('http://localhost:3000/classify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sql: sqlText })
                });

                const data = await response.json();
                
                // Populate the UI with backend data
                document.getElementById('resultCard').style.display = 'block';
                document.getElementById('categoryBadge').innerText = data.category;
                document.getElementById('categoryBadge').style.backgroundColor = data.valid ? '#28a745' : '#dc3545';
                document.getElementById('commandVal').innerText = data.command;
                document.getElementById('purposeVal').innerText = data.purpose;
                document.getElementById('effectVal').innerText = data.effect;
                document.getElementById('explanationVal').innerText = data.explanation;
            } catch (error) {
                console.error("Fetch Error:", error);
                alert('Connection Error: Is the Node.js server still running in your other terminal?');
            }
        }
    </script>
</body>
</html>
